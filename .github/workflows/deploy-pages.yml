name: Publicar CUBIKEITOR 3000 en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Validar código JavaScript
        run: |
          node --check src/core.js
          node --check src/app.js
          node --check src/legacy-adapter.js
          node --check src/worker-controller.js
          node --check src/cost-worker.js
      - name: Ejecutar pruebas
        run: node --test tests/*.test.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar contenido del sitio
        run: |
          mkdir -p _site/src
          cp index.html _site/
          cp src/*.js src/*.json _site/src/
          touch _site/.nojekyll
      - name: Preparar paquete
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
