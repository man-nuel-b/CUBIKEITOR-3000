name: Cubikeitor 3000 - pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis
        run: |
          node --check src/core.js
          node --check src/app.js
          node --check src/legacy-adapter.js
          node --check src/worker-controller.js
          node --check src/cost-worker.js
          node --check src/floor-plan-core.js
          node --check src/snap-engine.js
          node --check src/cpq-parser.js
          node --check src/iso-presets.js
          node --check src/iso-structure.js
          node --check src/inspector-core.js
          node --check src/vector-wall-mesh.js
          node --check src/wall-cutouts.js
          node --check src/vector-opening-mesh.js
      - name: Ejecutar pruebas
        run: node --test tests/*.test.cjs
      - name: Validar paquete Cloudflare Pages
        run: |
          sh scripts/build-pages.sh
          test -f dist/index.html
          test -f dist/src/core.js
          test -f dist/floor-plan.html
          test -f dist/src/vector-wall-mesh.js
          test -f dist/src/snap-engine.js
          test -f dist/src/cpq-parser.js
          test -f dist/cubikeitor-cpq-express.html
          test -f dist/cubikeitor-iso.html
          test -f dist/cubikeitor-cpq-pro.html
          test -f dist/src/inspector-core.js
          test -f dist/src/iso-presets.js
          test -f dist/src/iso-structure.js
          test -f dist/src/wall-cutouts.js
          test -f dist/src/vector-opening-mesh.js
